slug: beispiel-automation-tuebingen

business:
  name: Beispiel Automation
  legal_name: Beispiel Automation UG
  industry: KI- und Prozessautomatisierung
  city: Tübingen
  region: Tübingen–Stuttgart
  tagline: Automation mit Menschenverstand.

goal:
  primary: lead_form
  secondary: phone_call
  success_metric: Qualifizierte Anfragen für kostenlosen Prozess-Check

audience:
  primary: Geschäftsführer und Betriebsleiter in KMU (10–200 MA)
  secondary: HR- und Verwaltungsverantwortliche
  objections:
    - "Zu teuer / zu komplex für uns"
    - "Unsere Daten dürfen nicht in die Cloud"
    - "Wir haben schon Tools, die niemand nutzt"

usp: >
  Wir automatisieren wiederkehrende Abläufe in Verwaltung, HR und Reporting —
  passend zu bestehenden Systemen und mit klarer menschlicher Kontrolle.

archetype: service-local-b2b

positioning:
