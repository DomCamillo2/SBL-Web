      url: https://example.com
      notes: Zu technisch, keine lokale Verankerung
  visual_references:
    - ruhige Editorial-Layouts mit starker Typo
    - echte Arbeitskontexte statt Stock-Teams
  anti_references:
    - purple gradient SaaS landing pages
    - drei Feature-Cards mit Lucide-Icons im Hero

